name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # prisma.config.ts reads DATABASE_URL even for `prisma generate`; no database is contacted
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/note_test
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  build:
    name: Typecheck, build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd services/backend generate
      - run: bun run test:integration

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
